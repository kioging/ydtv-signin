name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows server package
        shell: pwsh
        run: .\build\build_windows.ps1
      - name: Upload Windows server package
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-signin-windows-x64
          path: release/ydtv-signin-windows-x64.zip
          if-no-files-found: error
      - name: Upload Windows WeChat helper ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-wechat-login-windows-x64
          path: release/ydtv-wechat-login-windows-x64.zip
          if-no-files-found: error
      - name: Upload Windows WeChat helper EXE
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-wechat-login-exe
          path: dist/ydtv-wechat-login.exe
          if-no-files-found: error

  build-linux:
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download Windows WeChat helper
        uses: actions/download-artifact@v4
        with:
          name: ydtv-wechat-login-exe
          path: downloads
      - name: Build Linux server package
        shell: bash
        env:
          YDTV_WECHAT_HELPER_EXE: downloads/ydtv-wechat-login.exe
        run: bash build/build_linux.sh
      - name: Upload Linux server package
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-signin-linux-x64
          path: release/ydtv-signin-linux-x64.zip
          if-no-files-found: error

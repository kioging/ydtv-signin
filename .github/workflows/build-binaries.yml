name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1
      - name: Run test suite
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows server package
        shell: pwsh
        run: .\build\build_windows.ps1
      - name: Upload Windows server package
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-signin-windows-x64
          path: release/ydtv-signin-windows-x64.zip
          if-no-files-found: error
      - name: Upload Windows WeChat helper
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-wechat-login-windows-x64
          path: release/ydtv-wechat-login-windows-x64.zip*
          if-no-files-found: error
      - name: Upload Windows WeChat helper EXE
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-wechat-login-exe
          path: dist/ydtv-wechat-login.exe
          if-no-files-found: error

  build-linux:
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows WeChat helper
        uses: actions/download-artifact@v4
        with:
          name: ydtv-wechat-login-exe
          path: downloads
      # 在 manylinux2014（CentOS 7 基础，glibc 2.17）里构建，
      # 让产物可以运行在 CentOS 7 / Alibaba Cloud Linux 2/3 等老系统上。
      - name: Build Linux server package (manylinux2014)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e PYTHON_BIN=/opt/python/cp311-cp311/bin/python3.11 \
            -e YDTV_WECHAT_HELPER_EXE=downloads/ydtv-wechat-login.exe \
            quay.io/pypa/manylinux2014_x86_64 \
            bash build/build_linux.sh
      - name: Report bundled glibc requirement
        run: |
          objdump -T dist/ydtv-signin/_internal/libpython3.11.so.1.0 \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3
      - name: Upload Linux server package
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-signin-linux-x64
          path: release/ydtv-signin-linux-x64.zip
          if-no-files-found: error

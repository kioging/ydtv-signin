name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest==9.1.1
      - name: Run test suite
        run: python -m pytest -q

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Windows server package
        shell: pwsh
        run: .\build\build_windows.ps1
      - name: Smoke test Windows binary
        shell: pwsh
        run: |
          $stage = "release\ydtv-signin-windows"
          '{"web": {"host": "127.0.0.1", "port": 8850}}' |
            Set-Content -Encoding UTF8 (Join-Path $stage "config.json")
          $proc = Start-Process -FilePath (Join-Path $stage "ydtv-signin.exe") -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8850/health" -UseBasicParsing -TimeoutSec 3
              if ($r.Content -match "ok") { $ok = $true; Write-Host $r.Content; break }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Windows binary smoke test failed" }
      - name: Upload Windows server package
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-signin-windows-x64
          path: release/ydtv-signin-windows-x64.zip
          if-no-files-found: error
      - name: Upload Windows WeChat helper
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-wechat-login-windows-x64
          path: release/ydtv-wechat-login-windows-x64.zip*
          if-no-files-found: error
      - name: Upload Windows WeChat helper EXE
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-wechat-login-exe
          path: dist/ydtv-wechat-login.exe
          if-no-files-found: error

  build-linux:
    needs: build-windows
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows WeChat helper
        uses: actions/download-artifact@v4
        with:
          name: ydtv-wechat-login-exe
          path: downloads
      # 在 manylinux2014（CentOS 7 基础，glibc 2.17）里构建，
      # 让产物可以运行在 CentOS 7 / Alibaba Cloud Linux 2/3 等老系统上。
      # 镜像自带的 CPython 是静态库，PyInstaller 需要共享库，所以用 uv 装一份
      # python-build-standalone 的 CPython 3.11（同为 glibc 2.17 基线，带 libpython）。
      - name: Build Linux server package (manylinux2014)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e YDTV_WECHAT_HELPER_EXE=downloads/ydtv-wechat-login.exe \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -lc '
              set -euo pipefail
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              uv python install 3.11
              PYTHON_BIN="$(uv python find 3.11)" bash build/build_linux.sh
            '
      - name: Report bundled glibc requirement
        run: |
          objdump -T dist/ydtv-signin/_internal/libpython3.11.so.1.0 \
            | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -3
      - name: Smoke test Linux binary
        run: |
          cd release/ydtv-signin-linux
          printf '{"web": {"host": "127.0.0.1", "port": 8850}}' > config.json
          ./ydtv-signin &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8850/health; then ok=1; break; fi
            sleep 1
          done
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          test "$ok" = "1"
      - name: Upload Linux server package
        uses: actions/upload-artifact@v4
        with:
          name: ydtv-signin-linux-x64
          path: release/ydtv-signin-linux-x64.zip
          if-no-files-found: error
